name: Update Products and Upload to S3
        
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "10 20 * * *"
  workflow_dispatch:
     inputs:
      refresh_cache:
        description: 'Принудительно обновить кэш изображений'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Кэш для image_cache.json ----------
      - name: Cache image check results
        uses: actions/cache@v4
        with:
          path: image_cache.json
          key: image-cache-${{ runner.os }}-${{ hashFiles('ztest6.py') }}
          restore-keys: |
            image-cache-${{ runner.os }}-

      # ---------- Установка Python и зависимостей ----------
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: |
          python -m pip install --upgrade pip
          pip install requests boto3 awscli

      # ---------- ОТЛАДКА: проверка доступа к S3 ----------
      - name: Debug S3 access
        if: github.event_name != 'push'
        run: |
          echo "Проверка доступа к S3..."
          aws s3 --endpoint-url https://s3.ru1.storage.beget.cloud ls s3://fa5a823588a1-antontyres/
          echo "Если видите список файлов или пустой вывод, то доступ есть."
          echo "Если ошибка, проверьте ключи и права."
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}

      # ---------- Запуск основного скрипта ----------
      - name: Run update tyres
        if: github.event_name != 'push'
        run: python ztest6.py
        env:
          IMAGE_CACHE_REFRESH: ${{ inputs.refresh_cache == true && 'true' || 'false' }}
          S3_ENABLED: true
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: fa5a823588a1-antontyres
          S3_KEY: exports/aztyre_full.xml
          S3_ENDPOINT: https://s3.ru1.storage.beget.cloud
        continue-on-error: true

      - name: Run test (optional)
        if: github.event_name != 'push'
        run: python ztest5.py
        continue-on-error: true

      # ---------- Коммит и пуш изменений ----------
      - name: Check for changes
        id: changes
        if: github.event_name != 'push' && always()
        run: |
          git add aztyre_full.xml aztyre.xml brand_statistics.txt image_cache.json
          if git diff-index --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: github.event_name != 'push' && always() && steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git commit -m 'Daily update of products XML'
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
