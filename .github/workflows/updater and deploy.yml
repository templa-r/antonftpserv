name: Update Products and Upload to S3

on:
  schedule:
    - cron: "00 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Установка Python и зависимостей ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests s3cmd

      # ---------- Запуск основного скрипта ----------
      - name: Run update tyres
        run: python ztest6.py
        env:
          LOCAL_MODE: "false"
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: fa5a823588a1-antontyres
          S3_ENDPOINT: https://s3.ru1.storage.beget.cloud
        continue-on-error: true

      # ---------- Артефакт: список отсутствующих фото ----------
      - name: Upload missing photos list
        uses: actions/upload-artifact@v4
        with:
          name: photos_missing
          path: photos_missing.txt
        if: always()

      # ---------- Коммит и пуш изменений ----------
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add aztyre_full.xml aztyre_rrc.xml brand_statistics.txt photos_missing.txt
          if git diff-index --quiet HEAD --; then
            echo "Нет изменений для коммита"
          else
            git commit -m 'Daily update of products XML'
          fi
          git pull --rebase --autostash origin main || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
