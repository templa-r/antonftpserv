name: Avito Export (шины)

on:
  push:
    branches: ["main"]
    paths:
      - 'avito_export3.py'          # запуск при изменении скрипта
  schedule:
    # Каждые 30 минут
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: 'Принудительно обновить кэш изображений'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-avito"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- Кэш для image_cache.json ----------
      - name: Cache image check results
        uses: actions/cache@v4
        with:
          path: image_cache.json
          key: image-cache-${{ runner.os }}-${{ hashFiles('avito_export3.py') }}
          restore-keys: |
            image-cache-${{ runner.os }}-

      # ---------- Запуск скрипта ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run avito export script
        run: python avito_export3.py
        env:
          IMAGE_CACHE_REFRESH: ${{ inputs.refresh_cache == true && 'true' || 'false' }}
        continue-on-error: false

      # ---------- Коммитим изменения (XML и кэш) ----------
      - name: Check for changes
        id: changes
        if: github.event_name != 'push' && always()
        run: |
          # Создаём пустой кэш, если его нет
          if [ ! -f image_cache.json ]; then
            echo '{}' > image_cache.json
          fi
          git add avito_export3.xml image_cache.json
          if git diff-index --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git commit -m 'Update avito_export3.xml'
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---------- Деплой на GitHub Pages ----------
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
