name: Avito Export (шины)

on:
  push:
    branches: ["main"]
    paths:
      - 'avito_export3.py'
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      only_whitelist_brands:
        description: 'Выгружать ТОЛЬКО белый список брендов'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: "avito-export"
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests s3cmd

      - name: Run avito export script
        run: python avito_export3.py
        env:
          ONLY_WHITELIST_BRANDS: ${{ inputs.only_whitelist_brands == true && 'true' || 'false' }}
          S3_ENABLED: true
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_BUCKET: fa5a823588a1-antontyres
          S3_KEY: exports/avito_export3.xml
          S3_ENDPOINT: https://s3.ru1.storage.beget.cloud
          S3_IMAGES_PREFIX: images/
        continue-on-error: false
