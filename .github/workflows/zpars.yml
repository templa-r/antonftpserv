name: Сбор цен конкурентов (Playwright)

on:
  schedule:
    # Запуск каждый день в 2:00 UTC (пример)
    - cron: "0 2 * * *"
  workflow_dispatch:   # позволяет запускать вручную
    inputs:
      max_ads:
        description: 'Максимальное количество объявлений (0 = без ограничения)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  collect-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # защита от зависания

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Кэш для браузеров Playwright, чтобы не качать каждый раз
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('zpars.py') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4 requests

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          playwright install --with-deps chromium

      # Если кэш был, всё равно проверим системные зависимости (без повторной загрузки браузера)
      - name: Ensure system deps for Playwright
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          playwright install-deps chromium

      - name: Run competitor parser
        run: python zpars.py
        env:
          MAX_ADS: ${{ inputs.max_ads || '0' }}

      # Проверяем, изменился ли файл
      - name: Check for changes
        id: changes
        run: |
          if [ ! -f competitor_prices.json ]; then
            echo '{}' > competitor_prices.json
          fi
          git add competitor_prices.json
          if git diff-index --quiet HEAD; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git commit -m 'Автообновление цен конкурентов'
          git pull --rebase origin main
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
